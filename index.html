<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>하이웨이 레스트 (Highway Rest) - 출발/도착지 기반 고속도로 휴게소 내비게이터</title>
  
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 가로 스크롤 영역 스크롤바 숨김 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Leaflet 커스텀 팝업 스타일링 */
    .leaflet-popup-content-wrapper {
      border-radius: 1rem !important;
      padding: 0 !important;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.18), 0 8px 10px -6px rgb(0 0 0 / 0.1) !important;
      border: 1px solid #e2e8f0;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 295px !important;
      font-family: 'Pretendard', sans-serif;
    }
    .leaflet-popup-tip {
      background: #ffffff !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #ffffff !important;
      top: 10px !important;
      right: 10px !important;
      width: 24px !important;
      height: 24px !important;
      font-size: 18px !important;
      background: rgba(255, 255, 255, 0.22) !important;
      border-radius: 9999px !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .leaflet-container a.leaflet-popup-close-button:hover {
      background: rgba(255, 255, 255, 0.4) !important;
    }

    /* 마커 펄스 애니메이션 */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.85);
        opacity: 0.85;
      }
      70% {
        transform: scale(1.75);
        opacity: 0;
      }
      100% {
        transform: scale(1.75);
        opacity: 0;
      }
    }
    .marker-pulse::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 9999px;
      background-color: #2563eb;
      animation: pulse-ring 1.7s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      z-index: -1;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased overflow-hidden select-none sm:select-auto">

  <!-- 전체 레이아웃 래퍼 -->
  <div class="relative w-screen h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- ==========================================
         좌측 사이드바 (데스크톱: 좌측 고정 / 모바일: 하단 바텀시트)
    =========================================== -->
    <aside id="sidebarPanel" class="
      fixed md:static bottom-0 left-0 right-0 z-30
      w-full md:w-[430px] lg:w-[450px] flex-shrink-0
      bg-white md:border-r border-slate-200
      flex flex-col
      h-[58vh] md:h-full
      rounded-t-3xl md:rounded-none
      shadow-[0_-10px_30px_-5px_rgba(0,0,0,0.15)] md:shadow-xl
      transition-all duration-300 ease-in-out
    ">
      
      <!-- 모바일 전용 바텀시트 핸들바 -->
      <div id="mobileSheetHandle" class="md:hidden flex flex-col items-center pt-2.5 pb-1.5 px-4 bg-white rounded-t-3xl cursor-pointer border-b border-slate-100" onclick="cycleMobileSheetState()">
        <div class="w-12 h-1.5 bg-slate-300 rounded-full mb-1.5"></div>
        <div class="w-full flex items-center justify-between text-xs text-slate-500 font-medium">
          <span class="flex items-center gap-1 text-blue-600 font-semibold">
            <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
            주행 순서 휴게소 타임라인
          </span>
          <span id="mobileSheetStateLabel" class="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-full text-slate-600">
            시트 크기 조절 <i data-lucide="chevrons-up-down" class="w-3 h-3"></i>
          </span>
        </div>
      </div>

      <!-- 상단 헤더 & 출발/도착지 직접 입력 영역 -->
      <div class="p-4 pb-3 bg-white border-b border-slate-200 flex-shrink-0">
        <!-- 타이틀 로고 -->
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
              <i data-lucide="route" class="w-5 h-5"></i>
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <h1 class="font-bold text-base text-slate-900 tracking-tight leading-none">고속도로 휴게소 내비</h1>
                <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded border border-blue-200">실시간 경로탐색</span>
              </div>
              <p class="text-xs text-slate-500 mt-1">출발지와 도착지를 입력하면 경로 상 휴게소를 순서대로 안내합니다</p>
            </div>
          </div>
        </div>

        <!-- 출발지 / 도착지 직접 입력 폼 -->
        <form onsubmit="handleRouteSearchSubmit(event)" class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/90 mb-2.5">
          <div class="flex items-center gap-2">
            <!-- 좌측 출발/도착 입력칸 -->
            <div class="flex-1 space-y-1.5">
              <!-- 출발지 입력 -->
              <div class="relative flex items-center">
                <span class="w-11 text-[11px] font-extrabold text-blue-600 flex items-center gap-1 pl-1.5">
                  <span class="w-2 h-2 rounded-full bg-blue-600"></span>출발
                </span>
                <input
                  id="startInput"
                  type="text"
                  value="부산"
                  placeholder="출발지 입력 (예: 부산, 창원, 대전, 해운대)"
                  class="flex-1 bg-white px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  required
                />
              </div>

              <!-- 도착지 입력 -->
              <div class="relative flex items-center">
                <span class="w-11 text-[11px] font-extrabold text-rose-600 flex items-center gap-1 pl-1.5">
                  <span class="w-2 h-2 rounded-full bg-rose-600"></span>도착
                </span>
                <input
                  id="endInput"
                  type="text"
                  value="서울"
                  placeholder="도착지 입력 (예: 서울, 강남역, 강릉, 광주)"
                  class="flex-1 bg-white px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  required
                />
              </div>
            </div>

            <!-- 스왑 버튼 & 경로 탐색 버튼 -->
            <div class="flex flex-col gap-1.5">
              <button
                type="button"
                onclick="swapStartEndInputs()"
                title="출발지와 도착지 바꾸기"
                class="p-2 bg-white hover:bg-slate-100 text-slate-600 rounded-xl border border-slate-200 transition-colors flex items-center justify-center shadow-sm"
              >
                <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
              </button>
              <button
                type="submit"
                id="searchRouteBtn"
                class="px-3 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl text-xs font-extrabold shadow-sm shadow-blue-500/20 transition-all flex items-center justify-center gap-1 whitespace-nowrap"
              >
                <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                <span>경로 탐색</span>
              </button>
            </div>
          </div>

          <!-- 빠른 추천 구간 프리셋 버튼 -->
          <div class="flex items-center gap-1.5 mt-2 pt-2 border-t border-slate-200/70 overflow-x-auto no-scrollbar">
            <span class="text-[10px] font-bold text-slate-400 flex-shrink-0">추천구간:</span>
            <button type="button" onclick="applyPresetRoute('부산', '서울')" class="flex-shrink-0 px-2 py-0.5 bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-600 transition-colors">부산 → 서울</button>
            <button type="button" onclick="applyPresetRoute('서울', '부산')" class="flex-shrink-0 px-2 py-0.5 bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-600 transition-colors">서울 → 부산</button>
            <button type="button" onclick="applyPresetRoute('창원', '서울')" class="flex-shrink-0 px-2 py-0.5 bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-600 transition-colors">창원 → 서울</button>
            <button type="button" onclick="applyPresetRoute('인천', '강릉')" class="flex-shrink-0 px-2 py-0.5 bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-600 transition-colors">인천 → 강릉</button>
            <button type="button" onclick="applyPresetRoute('서울', '광주')" class="flex-shrink-0 px-2 py-0.5 bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-600 transition-colors">서울 → 광주</button>
            <button type="button" onclick="applyPresetRoute('대구', '서울')" class="flex-shrink-0 px-2 py-0.5 bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-600 transition-colors">대구 → 서울</button>
          </div>
        </form>

        <!-- 상태 알림 토스트 (라우팅 진행 중 또는 안내 메시지) -->
        <div id="routeStatusNotice" class="hidden mb-2.5 px-3 py-1.5 rounded-lg bg-blue-50 border border-blue-200 text-blue-700 text-xs font-semibold flex items-center gap-2">
          <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>
          <span id="routeStatusText">실제 고속도로 주행 경로를 탐색하고 있습니다...</span>
        </div>

        <!-- 휴게소명 / 대표메뉴 빠른 검색 바 -->
        <div class="relative mb-2.5">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-3.5 h-3.5"></i>
          </div>
          <input
            id="searchInput"
            type="text"
            oninput="handleSearchInput(this.value)"
            placeholder="경로 내 휴게소 이름 또는 먹거리 필터 (예: 호두과자, 국밥, 안성)"
            class="w-full pl-8 pr-8 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition-all"
          />
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- 편의시설 필터 칩 (다중 선택 가능) -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5" id="filterChipsContainer">
          <!-- JS로 렌더링됨 -->
        </div>
      </div>

      <!-- 경로 요약 배너 -->
      <div id="routeSummaryBanner" class="px-4 py-2.5 bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white flex items-center justify-between flex-shrink-0 text-xs">
        <!-- JS로 업데이트됨 -->
      </div>

      <!-- 타임라인 카드 리스트 (내부 스크롤 영역) -->
      <div id="timelineContainer" class="flex-1 overflow-y-auto px-4 py-4 space-y-1 bg-slate-50/70">
        <!-- JS로 주행 순서대로 타임라인 카드가 렌더링됨 -->
      </div>

      <!-- 하단 푸터 안내 -->
      <div class="px-4 py-2 bg-white border-t border-slate-200 text-[11px] text-slate-400 flex items-center justify-between flex-shrink-0">
        <span>💡 카드를 클릭하면 지도에서 위치와 상세 정보를 봅니다</span>
        <span id="filteredCountBadge" class="font-semibold text-slate-600">총 16곳</span>
      </div>
    </aside>

    <!-- ==========================================
         우측 메인 영역 (Leaflet 지도 & 플로팅 컨트롤)
    =========================================== -->
    <main class="relative flex-1 w-full h-full bg-slate-200">
      <!-- Leaflet 지도 캔버스 -->
      <div id="map" class="w-full h-full z-10"></div>

      <!-- 상단 플로팅 배지: 현재 탐색된 출발지 → 도착지 표시 -->
      <div class="absolute top-3 left-3 right-16 md:right-auto z-20 pointer-events-none flex items-center gap-2">
        <div class="pointer-events-auto bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-2xl shadow-lg border border-slate-200/80 flex items-center gap-2.5">
          <span id="floatingHighwaySign" class="px-2 py-0.5 rounded-md bg-blue-600 text-white font-extrabold text-xs tracking-tight shadow-sm">
            고속도로 경로
          </span>
          <div class="text-xs">
            <p id="floatingRouteTitle" class="font-bold text-slate-800 leading-none">부산 → 서울</p>
            <p id="floatingRouteSub" class="text-[11px] text-slate-500 mt-0.5">주행 경로 반경 내 휴게소 순서대로 표시 중</p>
          </div>
        </div>
      </div>

      <!-- 우측 상단 지도 컨트롤 버튼 모음 -->
      <div class="absolute top-3 right-3 z-20 flex flex-col gap-2">
        <!-- 지도 타일 스타일 전환 (일반 도로 지도 / 위성 지도) -->
        <button onclick="toggleMapTileStyle()" id="mapTileToggleBtn" class="bg-white/95 hover:bg-slate-900 hover:text-white text-slate-700 backdrop-blur-md px-3 py-2 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-1.5 text-xs font-bold transition-all group" title="일반 도로 지도 / 위성 지도 전환">
          <i data-lucide="layers" class="w-4 h-4 text-indigo-600 group-hover:text-white transition-colors"></i>
          <span id="mapTileToggleText" class="hidden sm:inline">위성 지도 보기</span>
        </button>

        <button onclick="resetMapView()" class="bg-white/95 hover:bg-blue-600 hover:text-white text-slate-700 backdrop-blur-md px-3 py-2 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-1.5 text-xs font-bold transition-all group" title="전체 경로 한눈에 보기">
          <i data-lucide="maximize-2" class="w-4 h-4 text-blue-600 group-hover:text-white transition-colors"></i>
          <span class="hidden sm:inline">전체 경로 보기</span>
        </button>

        <button onclick="stepRestStop(-1)" class="bg-white/95 hover:bg-slate-100 text-slate-700 backdrop-blur-md px-3 py-2 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-1.5 text-xs font-semibold transition-all" title="이전 휴게소">
          <i data-lucide="chevron-up" class="w-4 h-4 text-slate-600"></i>
          <span class="hidden sm:inline">이전 휴게소</span>
        </button>

        <button onclick="stepRestStop(1)" class="bg-white/95 hover:bg-slate-100 text-slate-700 backdrop-blur-md px-3 py-2 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-1.5 text-xs font-semibold transition-all" title="다음 휴게소">
          <i data-lucide="chevron-down" class="w-4 h-4 text-slate-600"></i>
          <span class="hidden sm:inline">다음 휴게소</span>
        </button>
      </div>

      <!-- 모바일 전용 지도/목록 빠른 전환 플로팅 버튼 -->
      <div class="md:hidden absolute top-16 left-3 z-20">
        <button onclick="toggleMobileMapFull()" id="mobileToggleMapBtn" class="bg-slate-900/90 text-white backdrop-blur-md px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 text-xs font-semibold">
          <i data-lucide="map" class="w-3.5 h-3.5 text-blue-400"></i>
          <span id="mobileToggleMapBtnText">지도 크게 보기</span>
        </button>
      </div>
    </main>

  </div>

  <!-- ==========================================
       애플리케이션 데이터 및 스크립트
  =========================================== -->
  <script>
    /**
     * 1. 편의시설 필터 메타데이터 정의
     */
    const FACILITY_FILTERS = [
      { id: 'all', label: '전체', icon: 'layers' },
      { id: 'ev', label: '초급속 충전소', icon: 'zap' },
      { id: 'exOil', label: '알뜰주유소', icon: 'fuel' },
      { id: 'famousFood', label: '대표 맛집', icon: 'utensils' },
      { id: 'nursing', label: '수유실', icon: 'baby' },
      { id: 'truckLounge', label: '화물차라운지', icon: 'truck' },
      { id: 'pharmacy', label: '약국/샤워실', icon: 'pill' }
    ];

    const FACILITY_BADGE_MAP = {
      ev: { label: '전기차 초급속', icon: 'zap', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      exOil: { label: 'ex-OIL 알뜰', icon: 'fuel', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
      famousFood: { label: '명물맛집', icon: 'award', cls: 'bg-rose-50 text-rose-700 border-rose-200' },
      nursing: { label: '수유실', icon: 'baby', cls: 'bg-pink-50 text-pink-700 border-pink-200' },
      truckLounge: { label: '화물차라운지', icon: 'truck', cls: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      pharmacy: { label: '약국/편의', icon: 'plus-square', cls: 'bg-teal-50 text-teal-700 border-teal-200' }
    };

    /**
     * 2. 국내 주요 도시/거점 내장 좌표 사전 (빠른 응답 및 오프라인 폴백 지원)
     */
    const KOREA_PLACE_DICT = {
      '서울': { name: '서울 (양재IC/서울역)', lat: 37.5547, lng: 126.9707 },
      '서울역': { name: '서울역', lat: 37.5547, lng: 126.9707 },
      '강남': { name: '서울 강남 (양재IC)', lat: 37.4633, lng: 127.0365 },
      '강남역': { name: '서울 강남역', lat: 37.4979, lng: 127.0276 },
      '양재': { name: '서울 양재IC', lat: 37.4633, lng: 127.0365 },
      '부산': { name: '부산 (구서IC/부산역)', lat: 35.1796, lng: 129.0756 },
      '부산역': { name: '부산역', lat: 35.1152, lng: 129.0422 },

    /**
     * 7. 지도 스타일 전환 (일반 도로 지도 <-> 위성 지도)
     */
    function toggleMapTileStyle() {
      const btnText = document.getElementById('mapTileToggleText');
      if (currentTileMode === 'osm') {
        map.removeLayer(osmTileLayer);
        satelliteTileLayer.addTo(map);
        currentTileMode = 'satellite';
        btnText.textContent = '일반 도로 지도';
      } else {
        map.removeLayer(satelliteTileLayer);
        osmTileLayer.addTo(map);
        currentTileMode = 'osm';
        btnText.textContent = '위성 지도 보기';
      }
    }

    /**
     * 8. 두 위경도 좌표 사이의 거리(km) 계산 (Haversine 공식)
     */
    function calcDistanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    /**
     * 9. 장소명 텍스트 -> 좌표(위도, 경도) 변환 (내장 사전 우선 검색 후 Nominatim 무료 API 호출)
     */
    async function geocodePlaceName(rawText) {
      const clean = rawText.trim();
      // 1) 내장 주요 도시 사전과 일치하거나 키워드가 포함된 경우 즉시 반환
      if (KOREA_PLACE_DICT[clean]) {
        return KOREA_PLACE_DICT[clean];
      }
      for (const [key, val] of Object.entries(KOREA_PLACE_DICT)) {
        if (clean.includes(key)) {
          return { name: clean, lat: val.lat, lng: val.lng };
        }
      }

      // 2) Nominatim 오픈소스 지오코딩 API 호출 (대한민국 내 검색)
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=kr&limit=1&q=${encodeURIComponent(clean)}`;
        const res = await fetch(url, {
          headers: { 'Accept-Language': 'ko' }
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0) {
            return {
              name: clean,
              lat: parseFloat(data[0].lat),
              lng: parseFloat(data[0].lon)
            };
          }
        }
      } catch (e) {
        console.warn('Nominatim 지오코딩 폴백 작동:', e);
      }

      return null;
    }

    /**
     * 10. 출발지/도착지 좌표로 실제 도로 주행 경로(OSRM API) 조회 및 휴게소 자동 매칭
     */
    async function executeRouteSearch(startText, endText) {
      const statusBox = document.getElementById('routeStatusNotice');
      const statusText = document.getElementById('routeStatusText');
      const searchBtn = document.getElementById('searchRouteBtn');

      statusBox.classList.remove('hidden');
      statusText.textContent = `'${startText} → ${endText}' 최적 고속도로 경로 및 휴게소 탐색 중...`;
      searchBtn.disabled = true;

      try {
        const startPlace = await geocodePlaceName(startText) || KOREA_PLACE_DICT['부산'];
        const endPlace = await geocodePlaceName(endText) || KOREA_PLACE_DICT['서울'];

        let routeCoords = [];
        let totalKm = 0;
        let totalMinutes = 0;

        // OSRM 무료 라우팅 API 호출
        try {
          const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startPlace.lng},${startPlace.lat};${endPlace.lng},${endPlace.lat}?overview=full&geometries=geojson`;
          const res = await fetch(osrmUrl);
          if (res.ok) {
            const json = await res.json();
            if (json.routes && json.routes.length > 0) {
              const r = json.routes[0];
              routeCoords = r.geometry.coordinates.map(c => [c[1], c[0]]); // [lat, lng] 변환
              totalKm = Math.round(r.distance / 1000);
              totalMinutes = Math.round(r.duration / 60);
            }
          }
        } catch (err) {
          console.warn('OSRM API 호출 실패, 내장 고속도로 선형으로 폴백합니다:', err);
        }

        // 만약 OSRM 응답이 없을 경우 시작~종점 사이 내장 경유선 생성
        if (routeCoords.length < 2) {
          routeCoords = buildFallbackPolyline(startPlace, endPlace);
          totalKm = Math.round(calcDistanceKm(startPlace.lat, startPlace.lng, endPlace.lat, endPlace.lng) * 1.22);
          totalMinutes = Math.round((totalKm / 92) * 60);
        }

        // 주행 방향 판별 (위도 차이가 크면 상행 UP / 하행 DOWN)
        const latDiff = endPlace.lat - startPlace.lat;
        const isGoingNorth = latDiff >= 0;

        // 경로 폴리라인을 따라 누적 거리 배열 생성
        const cumulativeKmAtPoint = [0];
        let accKm = 0;
        for (let i = 1; i < routeCoords.length; i++) {
          accKm += calcDistanceKm(
            routeCoords[i - 1][0], routeCoords[i - 1][1],
            routeCoords[i][0], routeCoords[i][1]
          );
          cumulativeKmAtPoint.push(accKm);
        }
        if (totalKm === 0) totalKm = Math.max(10, Math.round(accKm));
        if (totalMinutes === 0) totalMinutes = Math.max(15, Math.round((totalKm / 92) * 60));

        // 전체 휴게소 중 현재 주행 경로 폴리라인에서 반경 5.5km 이내에 있는 휴게소 필터링
        const matched = [];
        ALL_HIGHWAY_STOPS.forEach(stop => {
          // 상행/하행 전용 휴게소 방향 필터링 (경부선 등 상/하행 분리 휴게소 대응)
          if (stop.dir === 'UP' && !isGoingNorth) return;
          if (stop.dir === 'DOWN' && isGoingNorth) return;

          let minDistanceToRoute = Infinity;
          let closestPointIndex = 0;

          for (let i = 0; i < routeCoords.length; i++) {
            const d = calcDistanceKm(stop.lat, stop.lng, routeCoords[i][0], routeCoords[i][1]);
            if (d < minDistanceToRoute) {
              minDistanceToRoute = d;
              closestPointIndex = i;
            }
          }

          // 경로선으로부터 5.5km 이내에 위치한 휴게소만 채택
          if (minDistanceToRoute <= 5.5) {
            const kmFromStart = Math.max(1, Math.round(cumulativeKmAtPoint[closestPointIndex]));
            matched.push({
              ...stop,
              kmFromStart,
              routePointIndex: closestPointIndex
            });
          }
        });

        // 실제 주행 순서(출발지로부터의 경로 인덱스 순)대로 정렬
        matched.sort((a, b) => a.routePointIndex - b.routePointIndex);

        const hours = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;
        const estTimeText = hours > 0 ? `약 ${hours}시간 ${mins}분` : `약 ${mins}분`;

        activeRouteData = {
          startName: startText.trim(),
          startCoord: [startPlace.lat, startPlace.lng],
          endName: endText.trim(),
          endCoord: [endPlace.lat, endPlace.lng],
          totalDistanceKm: totalKm,
          estTimeText,
          themeColor: isGoingNorth ? '#2563eb' : '#4f46e5',
          polyline: routeCoords,
          matchedStops: matched
        };

        selectedStopId = null;

        // 상단 플로팅 배지 업데이트
        document.getElementById('floatingHighwaySign').style.backgroundColor = activeRouteData.themeColor;
        document.getElementById('floatingRouteTitle').textContent = `${activeRouteData.startName} → ${activeRouteData.endName}`;
        document.getElementById('floatingRouteSub').textContent = `총 ${totalKm}km · 경로 상 휴게소 ${matched.length}곳 탐색됨`;

        // 지도 폴리라인 및 마커 렌더링
        drawRoutePolyline(activeRouteData, true);
        updateView();
      } finally {
        statusBox.classList.add('hidden');
        searchBtn.disabled = false;
        lucide.createIcons();
      }
    }

    /**
     * 11. 네트워크 오프라인 시 사용할 기본 고속도로 보간 폴리라인 생성기
     */
    function buildFallbackPolyline(startPlace, endPlace) {
      const isNorth = endPlace.lat >= startPlace.lat;
      const relevantStops = ALL_HIGHWAY_STOPS.filter(s => {
        if (s.dir === 'UP' && !isNorth) return false;
        if (s.dir === 'DOWN' && isNorth) return false;
        const minLat = Math.min(startPlace.lat, endPlace.lat) - 0.05;
        const maxLat = Math.max(startPlace.lat, endPlace.lat) + 0.05;
        return s.lat >= minLat && s.lat <= maxLat;
      }).sort((a, b) => isNorth ? a.lat - b.lat : b.lat - a.lat);

      return [
        [startPlace.lat, startPlace.lng],
        ...relevantStops.map(s => [s.lat, s.lng]),
        [endPlace.lat, endPlace.lng]
      ];
    }

    /**
     * 12. 폼 제출 / 스왑 / 프리셋 버튼 핸들러

      executeRouteSearch(s, d);

    function swapStartEndInputs() {
      const startEl = document.getElementById('startInput');
      const endEl = document.getElementById('endInput');
      const temp = startEl.value;
      startEl.value = endEl.value;
      endEl.value = temp;
      executeRouteSearch(startEl.value, endEl.value);
    }

    function applyPresetRoute(startText, endText) {
      document.getElementById('startInput').value = startText;
      document.getElementById('endInput').value = endText;
      executeRouteSearch(startText, endText);
    }

    /**
     * 13. 현재 탐색된 휴게소 중 편의시설 필터 + 검색어 필터 적용
     */
    function getFilteredStops() {
      const query = searchQuery.trim().toLowerCase();

      return activeRouteData.matchedStops.map((stop, idx) => ({
        ...stop,
        driveOrder: idx + 1 // 주행 순서 번호 (1, 2, 3...)
      })).filter(stop => {
        if (activeFilters.size > 0) {
          for (const reqFacility of activeFilters) {
            if (!stop.facilities.includes(reqFacility)) return false;
          }
        }
        if (query) {
          const inName = stop.name.toLowerCase().includes(query);
          const inHighway = stop.highway.toLowerCase().includes(query);
          const inSig = stop.signatureFood.name.toLowerCase().includes(query);
          const inSub = stop.subFoods.some(f => f.toLowerCase().includes(query));
          const inHighlight = stop.highlight.toLowerCase().includes(query);
          if (!inName && !inHighway && !inSig && !inSub && !inHighlight) return false;
        }
        return true;
      });
    }

    /**
     * 14. 고속도로 경로선(Polyline) 및 출발/도착 마커 렌더링
     */
    function drawRoutePolyline(route, fitBounds = true) {
      routeLayerGroup.clearLayers();

      // 외곽선 폴리라인
      L.polyline(route.polyline, {
        color: '#0f172a',
        weight: 10,
        opacity: 0.35,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(routeLayerGroup);

      // 메인 고속도로 컬러 폴리라인
      const mainPolyline = L.polyline(route.polyline, {
        color: route.themeColor,
        weight: 6,
        opacity: 0.92,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(routeLayerGroup);

      // 중앙 주행 점선
      L.polyline(route.polyline, {
        color: '#ffffff',
        weight: 2,
        opacity: 0.75,
        dashArray: '6, 12',
        lineCap: 'round'
      }).addTo(routeLayerGroup);

      // 출발지 마커
      const startIcon = L.divIcon({
        className: 'custom-terminal-icon',
        html: `
          <div class="px-2.5 py-1 rounded-full bg-slate-900 text-white text-[11px] font-extrabold shadow-lg border-2 border-white flex items-center gap-1 whitespace-nowrap -translate-x-1/2 -translate-y-1/2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            출발: ${route.startName}
          </div>
        `,
        iconSize: [0, 0]
      });
      L.marker(route.startCoord, { icon: startIcon, zIndexOffset: 900 }).addTo(routeLayerGroup);

      // 도착지 마커
      const endIcon = L.divIcon({
        className: 'custom-terminal-icon',
        html: `
          <div class="px-2.5 py-1 rounded-full bg-rose-600 text-white text-[11px] font-extrabold shadow-lg border-2 border-white flex items-center gap-1 whitespace-nowrap -translate-x-1/2 -translate-y-1/2">
            <span class="w-2 h-2 rounded-full bg-white"></span>
            도착: ${route.endName}
          </div>
        `,
        iconSize: [0, 0]
      });
      L.marker(route.endCoord, { icon: endIcon, zIndexOffset: 900 }).addTo(routeLayerGroup);

      if (fitBounds && route.polyline.length > 0) {
        const isMobile = window.innerWidth < 768;
        map.fitBounds(mainPolyline.getBounds(), {
          paddingTopLeft: [40, 70],
          paddingBottomRight: isMobile ? [40, window.innerHeight * 0.54] : [50, 50]
        });
      }
    }

    /**
     * 15. 화면 통합 업데이트
     */
    function updateView() {
      const filteredStops = getFilteredStops();

      renderSummaryBanner(activeRouteData, filteredStops);
      renderTimelineCards(activeRouteData, filteredStops);
      renderMapMarkers(activeRouteData, filteredStops);

      document.getElementById('filteredCountBadge').textContent =
        activeFilters.size > 0 || searchQuery.trim()
          ? `조건 일치 ${filteredStops.length}곳 / 전체 ${activeRouteData.matchedStops.length}곳`
          : `경로 상 휴게소 총 ${activeRouteData.matchedStops.length}곳`;

      lucide.createIcons();
    }

    /**
     * 16. 편의시설 필터 칩 렌더링
     */
    function renderFilterChips() {
      const container = document.getElementById('filterChipsContainer');
      container.innerHTML = FACILITY_FILTERS.map(filter => {
        const isAll = filter.id === 'all';
        const isActive = isAll ? activeFilters.size === 0 : activeFilters.has(filter.id);

        const activeClass = isActive
          ? 'bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/20'
          : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200/70';

        return `
          <button
            type="button"
            onclick="toggleFilter('${filter.id}')"
            class="flex-shrink-0 px-2.5 py-1.5 rounded-full text-xs font-semibold border transition-all flex items-center gap-1.5 ${activeClass}"
          >
            <i data-lucide="${filter.icon}" class="w-3.5 h-3.5"></i>
            <span>${filter.label}</span>
          </button>
        `;
      }).join('');
    }

    /**
     * 17. 경로 요약 배너 렌더링
     */
    function renderSummaryBanner(route, filteredStops) {
      const banner = document.getElementById('routeSummaryBanner');
      const lowestGas = filteredStops.length > 0
        ? Math.min(...filteredStops.map(s => s.gasPrice.gasoline))
        : null;

      banner.innerHTML = `
        <div class="flex items-center gap-2.5">
          <div class="flex items-center gap-1">
            <i data-lucide="compass" class="w-3.5 h-3.5 text-blue-400"></i>
            <span class="text-slate-300">총 거리</span>
            <strong class="text-white font-bold">${route.totalDistanceKm}km</strong>
          </div>
          <span class="text-slate-600">|</span>
          <div class="flex items-center gap-1">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-emerald-400"></i>
            <strong class="text-white font-bold">${route.estTimeText}</strong>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          ${lowestGas ? `
            <span class="px-2 py-0.5 rounded bg-amber-500/20 border border-amber-400/30 text-amber-300 font-semibold text-[11px]">
              최저 휘발유 ${lowestGas.toLocaleString()}원
            </span>
          ` : ''}
          <span class="px-2 py-0.5 rounded bg-blue-500/30 border border-blue-400/40 text-blue-200 font-bold">
            휴게소 ${filteredStops.length}곳
          </span>
        </div>
      `;
    }

    /**
     * 18. 주행 순서 타임라인 카드 렌더링
     */
    function renderTimelineCards(route, filteredStops) {
      const container = document.getElementById('timelineContainer');

      if (filteredStops.length === 0) {
        container.innerHTML = `
          <div class="py-12 px-4 text-center">
            <div class="w-12 h-12 rounded-2xl bg-slate-200/80 text-slate-500 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="search-x" class="w-6 h-6"></i>
            </div>
            <p class="text-sm font-bold text-slate-700">경로 상 조건에 맞는 휴게소가 없습니다</p>
            <p class="text-xs text-slate-500 mt-1">편의시설 필터를 해제하거나 위 추천 구간(부산→서울 등)을 선택해 보세요.</p>
            <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl shadow-sm hover:bg-blue-700 transition-colors">
              필터 초기화
            </button>
          </div>
        `;
        return;
      }

      // 출발지 카드 헤더
      let html = `
        <div class="flex items-center gap-3 pb-2 pl-1">
          <div class="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs font-bold shadow-sm flex-shrink-0">
            출발
          </div>
          <div class="flex-1 flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200/80 shadow-sm">
            <div>
              <span class="text-xs font-bold text-slate-800">${route.startName}</span>
              <span class="text-[11px] text-slate-400 ml-1.5">0 km 지점</span>
            </div>
            <span class="text-[11px] font-semibold text-blue-600">주행 시작</span>
          </div>
        </div>
      `;

      filteredStops.forEach((stop, index) => {
        const prevKm = index === 0 ? 0 : filteredStops[index - 1].kmFromStart;
        const segmentKm = Math.max(1, stop.kmFromStart - prevKm);
        const segmentMin = Math.max(3, Math.round((segmentKm / 95) * 60));
        const isSelected = selectedStopId === stop.id;

        const statusColor = stop.status === '원활'
          ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
          : stop.status === '보통'
          ? 'bg-blue-50 text-blue-700 border-blue-200'
          : 'bg-amber-50 text-amber-700 border-amber-200';

        const facilityTagsHtml = stop.facilities.map(fKey => {
          const meta = FACILITY_BADGE_MAP[fKey];
          if (!meta) return '';
          return `
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-medium border ${meta.cls}">
              <i data-lucide="${meta.icon}" class="w-3 h-3"></i>
              ${meta.label}
            </span>
          `;
        }).join('');

        html += `
          <!-- 구간 거리/시간 표시선 -->
          <div class="relative pl-4 py-1 flex items-center">
            <div class="absolute left-[17px] top-0 bottom-0 w-0.5 bg-gradient-to-b from-blue-300 to-blue-500"></div>
            <div class="ml-5 px-2.5 py-0.5 rounded-full bg-blue-50/90 border border-blue-200/80 text-[11px] font-semibold text-blue-700 flex items-center gap-1.5">
              <i data-lucide="arrow-down" class="w-3 h-3 text-blue-500"></i>
              <span>구간 +${segmentKm}km (약 ${segmentMin}분 주행)</span>
            </div>
          </div>

          <!-- 휴게소 타임라인 카드 본체 -->
          <div
            id="stop-card-${stop.id}"
            onclick="selectRestStop('${stop.id}')"
            class="relative flex items-start gap-3 group cursor-pointer"
          >
            <div class="absolute left-[17px] top-0 bottom-0 w-0.5 bg-slate-200 group-last:hidden"></div>

            <!-- 주행 순서 번호 배지 -->
            <div class="relative z-10 mt-3 w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold shadow transition-all flex-shrink-0 ${
              isSelected
                ? 'bg-blue-600 text-white ring-4 ring-blue-100 scale-110'
                : 'bg-white text-blue-700 border-2 border-blue-600 group-hover:bg-blue-600 group-hover:text-white'
            }">
              ${stop.driveOrder}
            </div>

            <!-- 우측 카드 박스 -->
            <div class="flex-1 rounded-2xl p-3.5 transition-all border ${
              isSelected
                ? 'bg-blue-50/50 border-blue-500 ring-2 ring-blue-500/20 shadow-md'
                : 'bg-white border-slate-200/90 hover:border-blue-300 hover:shadow-md'
            }">
              <div class="flex items-start justify-between gap-2 mb-1.5">
                <div>
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[10px] font-bold px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded">${stop.highway}</span>
                    <h3 class="font-bold text-sm text-slate-900 group-hover:text-blue-600 transition-colors">
                      ${stop.name}
                    </h3>
                    <span class="px-1.5 py-0.5 text-[10px] font-bold rounded border ${statusColor}">
                      ${stop.status}
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5 line-clamp-1">${stop.highlight}</p>
                </div>
                <div class="text-right flex-shrink-0">
                  <span class="inline-block px-2 py-0.5 bg-slate-900 text-white rounded-lg text-xs font-extrabold">
                    누적 ${stop.kmFromStart}km
                  </span>
                  <div class="text-[10px] text-amber-500 font-bold mt-0.5 flex items-center justify-end gap-0.5">
                    ★ ${stop.rating.toFixed(1)}
                  </div>
                </div>
              </div>

              <!-- 대표 먹거리 & 유가 정보 박스 -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 my-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-200/70">
                <div class="flex items-start gap-2">
                  <div class="w-7 h-7 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center flex-shrink-0 mt-0.5">
                    <i data-lucide="utensils" class="w-3.5 h-3.5"></i>
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1">
                      <span class="text-[10px] font-bold px-1.5 py-0.2 bg-rose-500 text-white rounded">${stop.signatureFood.badge}</span>
                      <span class="text-[11px] font-bold text-slate-500">${stop.signatureFood.price}</span>
                    </div>
                    <p class="text-xs font-bold text-slate-800 truncate mt-0.5" title="${stop.signatureFood.name}">
                      ${stop.signatureFood.name}
                    </p>
                    <p class="text-[10px] text-slate-400 truncate">인기: ${stop.subFoods.join(', ')}</p>
                  </div>
                </div>

                <div class="flex items-start gap-2 sm:border-l sm:border-slate-200 sm:pl-2.5 pt-1.5 sm:pt-0 border-t border-slate-200/60 sm:border-t-0">
                  <div class="w-7 h-7 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0 mt-0.5">
                    <i data-lucide="fuel" class="w-3.5 h-3.5"></i>
                  </div>
                  <div class="min-w-0 flex-1">
                    <span class="text-[10px] font-bold text-amber-700">${stop.gasPrice.brand}</span>
                    <div class="flex items-center gap-2 text-xs font-bold text-slate-800 mt-0.5">
                      <span>휘 <em class="not-italic text-blue-700">${stop.gasPrice.gasoline.toLocaleString()}</em></span>
                      <span class="text-slate-300">|</span>
                      <span>경 <em class="not-italic text-emerald-700">${stop.gasPrice.diesel.toLocaleString()}</em></span>
                    </div>
                    <p class="text-[10px] text-slate-400">리터당 원 기준</p>
                  </div>
                </div>
              </div>

              <!-- 보유 편의시설 태그 -->
              <div class="flex items-center flex-wrap gap-1">
                ${facilityTagsHtml}
              </div>
            </div>
          </div>
        `;
      });

      const lastKm = filteredStops[filteredStops.length - 1].kmFromStart;
      const remainKm = Math.max(1, route.totalDistanceKm - lastKm);
      html += `
        <div class="relative pl-4 py-1 flex items-center">
          <div class="absolute left-[17px] top-0 bottom-0 w-0.5 bg-slate-300"></div>
          <div class="ml-5 text-[11px] font-medium text-slate-500">
            도착지까지 잔여 +${remainKm}km
          </div>
        </div>
        <div class="flex items-center gap-3 pt-1 pl-1 pb-4">
          <div class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs font-bold shadow-sm flex-shrink-0">
            도착
          </div>
          <div class="flex-1 flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200/80 shadow-sm">
            <div>
              <span class="text-xs font-bold text-slate-800">${route.endName}</span>
              <span class="text-[11px] text-slate-400 ml-1.5">총 ${route.totalDistanceKm} km</span>
            </div>
            <span class="text-[11px] font-semibold text-rose-600">주행 완료</span>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    /**
     * 19. 지도 커스텀 마커 및 팝업 렌더링
     * - 겹침 방지를 위해 평상시에는 깔끔한 숫자 배지만 표시하고, 마우스 호버 시 또는 선택 시에만 휴게소 이름 라벨이 표시되도록 개선
     */
    function renderMapMarkers(route, filteredStops) {
      markersLayerGroup.clearLayers();
      markerInstances = {};

      filteredStops.forEach(stop => {
        const isSelected = selectedStopId === stop.id;
        const shortName = stop.name.replace(/\s*\(.*?\)/g, '');

        const customIcon = L.divIcon({
          className: 'custom-rest-stop-marker',
          html: `
            <div class="relative flex flex-col items-center group cursor-pointer -translate-x-1/2 -translate-y-1/2">
              <!-- 상단 말풍선 라벨: 선택되었거나 마우스 호버 시에만 노출하여 마커 겹침 완벽 방지 -->
              <div class="${
                isSelected
                  ? 'opacity-100 scale-105 bg-blue-600 text-white border-white z-30'
                  : 'opacity-0 pointer-events-none group-hover:opacity-100 bg-slate-900/95 text-white border-white/80'
              } absolute bottom-9 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold whitespace-nowrap shadow-md border transition-all duration-150">
                #${stop.driveOrder} ${shortName}
              </div>
              <!-- 원형 번호 핀 -->
              <div class="relative w-7 h-7 rounded-full flex items-center justify-center font-extrabold text-xs shadow-lg border-2 border-white transition-transform ${
                isSelected ? 'bg-blue-600 text-white scale-125 marker-pulse' : 'text-white group-hover:scale-110'
              }" style="background-color: ${isSelected ? '#2563eb' : route.themeColor}">
                ${stop.driveOrder}
              </div>
            </div>
          `,
          iconSize: [0, 0],
          popupAnchor: [0, -20]
        });

        const marker = L.marker([stop.lat, stop.lng], {
          icon: customIcon,
          zIndexOffset: isSelected ? 1000 : stop.driveOrder * 10
        });

        const facilityPills = stop.facilities.map(fKey => {
          const meta = FACILITY_BADGE_MAP[fKey];
          return meta
            ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold border ${meta.cls}">${meta.label}</span>`
            : '';
        }).join('');

        const popupHtml = `
          <div class="overflow-hidden bg-white text-slate-800">
            <div class="p-3.5 text-white" style="background: linear-gradient(135deg, ${route.themeColor}, #1e293b)">
              <div class="flex items-center gap-1.5 text-[11px] font-bold text-blue-200 mb-0.5">
                <span class="px-1.5 py-0.2 bg-white/20 rounded text-white">주행 #${stop.driveOrder}번째</span>
                <span>•</span>
                <span>${stop.highway} (출발 후 ${stop.kmFromStart}km)</span>
              </div>
              <h4 class="font-extrabold text-base leading-snug pr-6">${stop.name}</h4>
              <p class="text-[11px] text-slate-200 mt-1">${stop.highlight}</p>
            </div>

            <div class="p-3.5 space-y-2.5 text-xs">
              <div class="p-2.5 rounded-xl bg-rose-50/70 border border-rose-100">
                <div class="flex items-center justify-between mb-0.5">
                  <span class="text-[10px] font-extrabold text-rose-600 uppercase tracking-wider">🍴 대표 명물 먹거리</span>
                  <span class="font-extrabold text-rose-700">${stop.signatureFood.price}</span>
                </div>
                <p class="font-bold text-slate-900 text-xs">${stop.signatureFood.name}</p>
                <p class="text-[11px] text-slate-500 mt-0.5">추천 간식: ${stop.subFoods.join(', ')}</p>
              </div>

              <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
                <div>
                  <span class="text-[10px] font-bold text-amber-700 block">${stop.gasPrice.brand}</span>
                  <span class="font-bold text-slate-700">실시간 유가 안내</span>
                </div>
                <div class="text-right font-extrabold">
                  <div class="text-blue-700">휘발유 ${stop.gasPrice.gasoline.toLocaleString()}원</div>
                  <div class="text-emerald-700">경유 ${stop.gasPrice.diesel.toLocaleString()}원</div>
                </div>
              </div>

              <div class="flex flex-wrap gap-1 pt-0.5">
                ${facilityPills}
              </div>
            </div>
          </div>
        `;

        marker.bindPopup(popupHtml, {
          maxWidth: 300,
          autoPanPaddingTopLeft: [20, 80],
          autoPanPaddingBottomRight: [20, 80]
        });

        marker.on('click', () => {
          selectRestStop(stop.id, false);
        });

        marker.addTo(markersLayerGroup);
        markerInstances[stop.id] = marker;
      });
    }

    /**
     * 20. 휴게소 선택 시 지도 이동 및 팝업 오픈
     */
    function selectRestStop(stopId, flyToMarker = true) {
      selectedStopId = stopId;
      const stop = activeRouteData.matchedStops.find(s => s.id === stopId);
      if (!stop) return;

      const filteredStops = getFilteredStops();
      renderTimelineCards(activeRouteData, filteredStops);
      renderMapMarkers(activeRouteData, filteredStops);
      lucide.createIcons();

      const cardEl = document.getElementById(`stop-card-${stopId}`);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      if (window.innerWidth < 768 && mobileSheetState === 'full') {
        setMobileSheetState('half');
      }

      const marker = markerInstances[stopId];
      if (marker) {
        if (flyToMarker) {
          const isMobile = window.innerWidth < 768;
          const targetZoom = Math.max(map.getZoom(), 11);
          const targetLat = isMobile ? stop.lat - 0.08 : stop.lat;
          map.flyTo([targetLat, stop.lng], targetZoom, {
            animate: true,
            duration: 0.85
          });
        }
        setTimeout(() => {
          marker.openPopup();
        }, flyToMarker ? 350 : 50);
      }
    }

    /**
     * 21. 이전 / 다음 휴게소 순차 이동
     */
    function stepRestStop(direction) {
      const filteredStops = getFilteredStops();
      if (filteredStops.length === 0) return;

      const currentIndex = filteredStops.findIndex(s => s.id === selectedStopId);
      let nextIndex = 0;

      if (currentIndex === -1) {
        nextIndex = direction > 0 ? 0 : filteredStops.length - 1;
      } else {
        nextIndex = (currentIndex + direction + filteredStops.length) % filteredStops.length;
      }

      selectRestStop(filteredStops[nextIndex].id, true);
    }

    /**
     * 22. 필터 및 검색 컨트롤
     */
    function toggleFilter(filterId) {
      if (filterId === 'all') {
        activeFilters.clear();
      } else {
        if (activeFilters.has(filterId)) {
          activeFilters.delete(filterId);
        } else {
          activeFilters.add(filterId);
        }
      }
      renderFilterChips();
      updateView();
    }

    function handleSearchInput(val) {
      searchQuery = val;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      updateView();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      handleSearchInput('');
    }

    function resetFilters() {
      activeFilters.clear();
      clearSearch();
      renderFilterChips();
      updateView();
    }

    function resetMapView() {
      selectedStopId = null;
      map.closePopup();
      drawRoutePolyline(activeRouteData, true);
      updateView();
    }

    /**
     * 23. 모바일 바텀시트 높이 제어
     */
    function cycleMobileSheetState() {
      if (mobileSheetState === 'half') {
        setMobileSheetState('full');
      } else if (mobileSheetState === 'full') {
        setMobileSheetState('collapsed');
      } else {
        setMobileSheetState('half');
      }
    }

    function toggleMobileMapFull() {
      if (mobileSheetState === 'collapsed') {
        setMobileSheetState('half');
      } else {
        setMobileSheetState('collapsed');
      }
    }

    function setMobileSheetState(state) {
      mobileSheetState = state;
      const sidebar = document.getElementById('sidebarPanel');
      const btnText = document.getElementById('mobileToggleMapBtnText');

      sidebar.classList.remove('h-[58vh]', 'h-[88vh]', 'h-[15vh]');

      if (state === 'full') {
        sidebar.classList.add('h-[88vh]');
        btnText.textContent = '지도 크게 보기';
      } else if (state === 'collapsed') {
        sidebar.classList.add('h-[15vh]');
        btnText.textContent = '휴게소 목록 펼치기';
      } else {
        sidebar.classList.add('h-[58vh]');
        btnText.textContent = '지도 크게 보기';
      }

      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 310);
    }
  </script>
</body>
</html>
